name: Update GitHub Stats

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Generate stats card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=github_dark&hide_border=true
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate top languages card
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=github_dark&hide_border=true
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate streak stats
    uses: be-next/github-streak-stats-action@v1
    with:
      username: ${{ github.repository_owner }}
      token: ${{ secrets.GITHUB_TOKEN }}
      output-path: profile/streak.svg
      theme: dark
      hide-border: true

  - name: Commit generated cards
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/*.svg
      git commit -m "chore: update GitHub stats" || exit 0
      git push
```

